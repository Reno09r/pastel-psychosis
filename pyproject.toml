[project]
name = "pastel-psychosis-api"
version = "0.1.0"
description = "Light FastAPI backend for Pastel Psychosis registration and telemetry."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.122.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "ruff>=0.14.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
